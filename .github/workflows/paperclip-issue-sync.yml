name: Paperclip Issue Sync

on:
  issues:
    types: [opened, closed, reopened, labeled]

# Serialize runs per issue to prevent duplicate PC issues when `opened` and
# `labeled` fire simultaneously (they share the same issue number key).
# cancel-in-progress: false ensures the second event still runs and finds
# the already-created intake issue rather than creating a duplicate.
concurrency:
  group: paperclip-sync-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  PC_PROJECT_ID: de8c64a6-61e4-4d1c-bd95-0c1c8b9667f0
  PC_GOAL_ID: defcc9c2-ba75-4af6-b675-f96fa4501237
  AGENT_LYRA: 61b890c9-50a6-4fea-9d90-dd21d143279a

jobs:
  sync:
    name: Sync to Paperclip
    if: vars.PAPERCLIP_INTAKE_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      PC_API_URL: ${{ secrets.PAPERCLIP_API_URL }}
      PC_API_TOKEN: ${{ secrets.PAPERCLIP_API_TOKEN }}
      PC_COMPANY_ID: ${{ secrets.PAPERCLIP_COMPANY_ID }}
      CF_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}

    steps:
      # Handles opened, reopened, labeled — creates a single intake issue assigned to Lyra.
      # Lyra safety-screens and triages the content before assigning to operational agents.
      - name: Create intake issue for Lyra
        if: github.event.action != 'closed'
        env:
          GH_TITLE: ${{ github.event.issue.title }}
          GH_BODY: ${{ github.event.issue.body }}
          GH_HTML_URL: ${{ github.event.issue.html_url }}
          GH_REPO: ${{ github.repository }}
          GH_NUMBER: ${{ github.event.issue.number }}
          GH_ACTION: ${{ github.event.action }}
          GH_LABELS: ${{ toJSON(github.event.issue.labels) }}
        run: |
          ORIGIN_ID="github-issue:${GH_REPO}#${GH_NUMBER}"
          ENCODED_URL=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['GH_HTML_URL']))")

          # Check for an existing intake issue for this GitHub issue (dedup for labeled/reopened).
          RESP=$(curl -sf \
            -H "Authorization: Bearer $PC_API_TOKEN" \
            -H "CF-Access-Client-Id: $CF_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_CLIENT_SECRET" \
            "$PC_API_URL/api/companies/$PC_COMPANY_ID/issues?q=$ENCODED_URL" \
            || echo '{"issues":[]}')

          PC_ID=$(echo "$RESP" | jq -r \
            --arg oid "$ORIGIN_ID" \
            --arg url "$GH_HTML_URL" \
            '(if type == "array" then . else (.issues // []) end) | map(select(.originId == $oid or (.description // "" | contains($url)))) | first | .id // ""')

          if [ -n "$PC_ID" ]; then
            echo "Intake issue $PC_ID already exists for $ORIGIN_ID (action=$GH_ACTION)"
            if [ "$GH_ACTION" = "reopened" ]; then
              echo "Reopening intake issue $PC_ID"
              curl -sf -X PATCH \
                -H "Authorization: Bearer $PC_API_TOKEN" \
                -H "CF-Access-Client-Id: $CF_CLIENT_ID" \
                -H "CF-Access-Client-Secret: $CF_CLIENT_SECRET" \
                -H "Content-Type: application/json" \
                "$PC_API_URL/api/issues/$PC_ID" \
                -d '{"status":"todo"}'
            fi
          else
            echo "Creating intake issue for $ORIGIN_ID"
            LABEL_NAMES=$(echo "$GH_LABELS" | jq -r '[.[].name] | join(", ")')
            PAYLOAD=$(jq -n \
              --arg title "$GH_TITLE" \
              --arg body "${GH_BODY:-}" \
              --arg url "$GH_HTML_URL" \
              --arg repo "$GH_REPO" \
              --arg number "$GH_NUMBER" \
              --arg labels "$LABEL_NAMES" \
              --arg assigneeAgentId "$AGENT_LYRA" \
              --arg originId "$ORIGIN_ID" \
              --arg projectId "$PC_PROJECT_ID" \
              --arg goalId "$PC_GOAL_ID" \
              '{
                title: ("[INTAKE] " + $title),
                description: ("## GitHub Issue Intake\n\n**Title:** " + $title + "\n**Repository:** " + $repo + "\n**Issue number:** #" + $number + "\n**Labels:** " + $labels + "\n**URL:** " + $url + "\n\n---\n\n## Original body\n\n" + $body + "\n\n---\n\nSource: " + $url),
                projectId: $projectId,
                goalId: $goalId,
                status: "todo",
                priority: "high",
                assigneeAgentId: $assigneeAgentId,
                originKind: "github",
                originId: $originId
              }')
            curl -sf -X POST \
              -H "Authorization: Bearer $PC_API_TOKEN" \
              -H "CF-Access-Client-Id: $CF_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_CLIENT_SECRET" \
              -H "Content-Type: application/json" \
              "$PC_API_URL/api/companies/$PC_COMPANY_ID/issues" \
              -d "$PAYLOAD"
          fi

      - name: Close → mark Paperclip issue done
        if: github.event.action == 'closed'
        env:
          GH_HTML_URL: ${{ github.event.issue.html_url }}
          GH_REPO: ${{ github.repository }}
          GH_NUMBER: ${{ github.event.issue.number }}
        run: |
          ORIGIN_ID="github-issue:${GH_REPO}#${GH_NUMBER}"
          ENCODED_URL=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['GH_HTML_URL']))")

          RESP=$(curl -sf \
            -H "Authorization: Bearer $PC_API_TOKEN" \
            -H "CF-Access-Client-Id: $CF_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_CLIENT_SECRET" \
            "$PC_API_URL/api/companies/$PC_COMPANY_ID/issues?q=$ENCODED_URL" \
            || echo '{"issues":[]}')

          PC_ID=$(echo "$RESP" | jq -r \
            --arg oid "$ORIGIN_ID" \
            --arg url "$GH_HTML_URL" \
            '(if type == "array" then . else (.issues // []) end) | map(select(.originId == $oid or (.description // "" | contains($url)))) | first | .id // ""')

          if [ -z "$PC_ID" ]; then
            echo "No matching Paperclip issue found for $ORIGIN_ID — nothing to close."
            exit 0
          fi

          echo "Marking Paperclip issue $PC_ID as done"
          PATCH=$(jq -n \
            --arg comment "Closed via GitHub: $GH_HTML_URL" \
            '{status: "done", comment: $comment}')
          curl -sf -X PATCH \
            -H "Authorization: Bearer $PC_API_TOKEN" \
            -H "CF-Access-Client-Id: $CF_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $CF_CLIENT_SECRET" \
            -H "Content-Type: application/json" \
            "$PC_API_URL/api/issues/$PC_ID" \
            -d "$PATCH"
