name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend build
        working-directory: frontend
        run: npm ci && npm run build

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache: true

      - name: Install C toolchain (for go-duckdb CGo)
        run: sudo apt-get install -y gcc

      - name: go vet
        run: CGO_ENABLED=1 go vet ./...

      - name: go test
        run: CGO_ENABLED=1 go test ./...

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      # Ports now bind before the DB opens and answer 503 until it is ready, so
      # we must wait on actual readiness (/healthz → 200), not just a bound port.
      - name: Wait for readiness (max 60 s)
        run: |
          timeout 60 bash -c \
            'until curl -sf -o /dev/null http://localhost:8080/healthz; do sleep 1; done'

      - name: POST sample OTLP payload
        run: |
          curl -sf -X POST http://localhost:4318/v1/traces \
            -H 'Content-Type: application/json' \
            -d @testdata/fixtures/sample-otlp-payload.json

      - name: Wait for async DB write
        run: sleep 2

      - name: Verify span count via healthz
        run: |
          RESP=$(curl -sf http://localhost:8080/healthz)
          echo "healthz: $RESP"
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['spans'] == 3, f'expected 3 spans, got {d[\"spans\"]}'"

      - name: Dashboard health check
        run: curl -sf http://localhost:8080/

      - name: JSON API health check
        run: |
          RESP=$(curl -sf http://localhost:8080/api/v1/health)
          echo "api/v1/health: $RESP"
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status'] == 'ok', f'expected status ok, got {d}'"

      - name: Tear down
        if: always()
        run: docker compose down
