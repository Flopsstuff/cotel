name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Install C toolchain (for go-duckdb CGo)
        run: sudo apt-get install -y gcc

      - name: go vet
        run: CGO_ENABLED=1 go vet ./...

      - name: go test
        run: CGO_ENABLED=1 go test ./...

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for ingest (max 30 s)
        run: |
          timeout 30 bash -c \
            'until curl -s -o /dev/null http://localhost:4318/; do sleep 1; done'

      - name: POST sample OTLP payload
        run: |
          curl -sf -X POST http://localhost:4318/v1/traces \
            -H 'Content-Type: application/json' \
            -d @testdata/fixtures/sample-otlp-payload.json

      - name: Wait for async DB write
        run: sleep 2

      - name: Verify span count via healthz
        run: |
          RESP=$(curl -sf http://localhost:8080/healthz)
          echo "healthz: $RESP"
          echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['spans'] == 3, f'expected 3 spans, got {d[\"spans\"]}'"

      - name: Dashboard health check
        run: curl -sf http://localhost:8080/

      - name: Tear down
        if: always()
        run: docker compose down

  docker:
    name: Docker build & publish
    runs-on: ubuntu-latest
    needs: smoke
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
