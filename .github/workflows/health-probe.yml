name: Health probe

# Hourly is the interval: six silent days was the failure mode, and catching
# it the same day is the acceptance bar. The 6h ingest-age threshold is
# independent — a quiet night is not an alert; six hours without a span is.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: "Override /healthz URL (empty = production dashboard)"
        required: false
        default: ""
      page:
        description: "Create or resolve a Paperclip alert for this run"
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
    paths:
      - "scripts/probe-healthz.sh"
      - "scripts/probe-healthz_test.sh"
      - "scripts/page-cotel-health.sh"
      - ".github/workflows/health-probe.yml"

permissions:
  contents: read

jobs:
  test:
    name: Probe script tests
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run probe-healthz tests
        run: bash scripts/probe-healthz_test.sh

  probe:
    name: Probe production /healthz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      HEALTHZ_URL: ${{ inputs.url || 'https://cotel.aignite.pl/healthz' }}
      STALE_AFTER_SECONDS: "21600"
      CONNECT_TIMEOUT: "15"
      CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
      PC_API_URL: ${{ secrets.PAPERCLIP_API_URL }}
      PC_API_TOKEN: ${{ secrets.PAPERCLIP_API_TOKEN }}
      PC_COMPANY_ID: ${{ secrets.PAPERCLIP_COMPANY_ID }}
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5

      - name: Probe /healthz
        id: probe
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP"
          PROBE_OUT="$RUNNER_TEMP/probe.out"
          set +e
          scripts/probe-healthz.sh | tee "$PROBE_OUT"
          rc=${PIPESTATUS[0]}
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "out=$PROBE_OUT" >> "$GITHUB_OUTPUT"
          echo "PROBE_OUT=$PROBE_OUT" >> "$GITHUB_ENV"
          echo "PROBE_RC=$rc" >> "$GITHUB_ENV"

      - name: Page Paperclip on red
        if: env.PROBE_RC != '0' && (github.event_name == 'schedule' || inputs.page)
        run: scripts/page-cotel-health.sh raise "$PROBE_OUT"

      - name: Resolve Paperclip alert on green
        if: env.PROBE_RC == '0' && (github.event_name == 'schedule' || inputs.page)
        run: scripts/page-cotel-health.sh resolve

      - name: Fail the job when the probe is red
        if: env.PROBE_RC != '0'
        run: |
          echo "probe-healthz exited ${PROBE_RC}"
          cat "$PROBE_OUT"
          exit 1
