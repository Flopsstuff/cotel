name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version segment to bump (first release will be v0.1.0)'
        required: true
        default: 'minor'
        type: choice
        options:
          - minor
          - patch
          - major

env:
  REGISTRY: ghcr.io
  # GHCR digests require a lowercase repository path.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  prepare:
    name: Tag release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.image.outputs.name }}
      revision: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Ensure running on main
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Releases must be triggered from the main branch."
            exit 1
          fi

      - name: Lowercase image name
        id: image
        run: |
          echo "name=${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          LATEST=$(git tag -l "v[0-9]*.[0-9]*.[0-9]*" | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            TAG="v0.1.0"
          else
            MAJOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f1)
            MINOR=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f2)
            PATCH=$(echo "$LATEST" | sed 's/^v//' | cut -d. -f3)
            case "${{ inputs.bump }}" in
              major) TAG="v$((MAJOR+1)).0.0" ;;
              minor) TAG="v${MAJOR}.$((MINOR+1)).0" ;;
              patch) TAG="v${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Next version: $TAG"

      - name: Update CHANGELOG and extract release notes
        run: |
          python3 - "${{ steps.version.outputs.version }}" "$(date -u +%Y-%m-%d)" << 'PYEOF'
          import sys, re

          version, date = sys.argv[1], sys.argv[2]

          with open("CHANGELOG.md") as f:
              content = f.read()

          if "## [Unreleased]" not in content:
              print("::error::CHANGELOG.md has no [Unreleased] section.")
              sys.exit(1)

          # Stamp [Unreleased] → [version] - date, keep a fresh [Unreleased] at top
          updated = content.replace(
              "## [Unreleased]",
              f"## [Unreleased]\n\n## [{version}] - {date}",
              1
          )

          with open("CHANGELOG.md", "w") as f:
              f.write(updated)

          # Extract notes between the new versioned heading and the next ## heading
          pattern = rf"## \[{re.escape(version)}\] - {re.escape(date)}\n(.*?)(?=\n## \[|\Z)"
          m = re.search(pattern, updated, re.DOTALL)
          notes = m.group(1).strip() if m else "_No changes documented._"

          with open("release-notes.md", "w") as f:
              f.write(notes or "_No changes documented._")

          print(f"Release notes written ({len(notes)} chars)")
          PYEOF

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and tag
        id: commit
        run: |
          git add CHANGELOG.md
          git commit -m "chore: release ${{ steps.version.outputs.tag }}"
          git tag -a "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.version.outputs.tag }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            digest_name: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            digest_name: linux-arm64
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.revision }}
          outputs: type=image,name=${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.digest_name }}
          cache-to: type=gha,scope=${{ matrix.digest_name }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.digest_name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Manifest and GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ needs.prepare.outputs.image }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag }}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ needs.prepare.outputs.image }}@sha256:%s ' *)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.prepare.outputs.tag }}" \
            --title "cotel ${{ needs.prepare.outputs.tag }}" \
            --notes-file release-notes.md
